name: Wextra Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ZIP'i aç
        run: |
          mkdir -p project
          unzip -o WextraApp.zip -d project

      - name: Proje klasörünü bul
        run: |
          PROJECT_DIR=$(find project -name package.json -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: ZIP içinde package.json bulunamadı!"
            exit 1
          fi

          echo "Proje bulundu: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Bağımlılıkları kur
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install

      - name: Expo Android projesini hazırla
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: APK oluştur
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Wextra-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
